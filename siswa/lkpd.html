  <script src="../js/siswa_data.js?v=20261019_v11"></script>
  <script src="../js/core.js?v=20261019_v11"></script>
  <script>
    window.activeUser = (window.FincestemCore && FincestemCore.auth && FincestemCore.auth.getUser()) || {
      name: 'Peserta Field Trip',
      class: 'Kelas X',
      nisn: '0000000000',
      identifier: '0000000000',
      role: 'siswa',
      facilitator_name: 'Tim Fasilitator SMAN 1 Belitang'
    };
    var activeUser = window.activeUser;
  </script>
  <script src="../js/modules/lkpd-fieldtrip.js?v=20261019_v11"></script>
  <script>

    document.addEventListener('DOMContentLoaded', () => {
      window.activeUser = (window.FincestemCore && FincestemCore.auth && FincestemCore.auth.getUser()) || window.activeUser;
      activeUser = window.activeUser;

      const urlParams = new URLSearchParams(window.location.search);
      const rawDay = urlParams.get('day');
      const dayNum = (rawDay !== null && rawDay !== '') ? parseInt(rawDay) : 1;
      const isReadOnlyUrl = (urlParams.get('readonly') === '1');

      // Proteksi Alur Berurutan Cepat: Day N (N > 1) mewajibkan Day N-1 selesai
      if (dayNum > 1 && window.FincestemCore && FincestemCore.progress) {
        let cachedProg = null;
        try {
          const rawP = localStorage.getItem('fincestem_progress_' + (activeUser.nisn || activeUser.identifier));
          if (rawP) cachedProg = JSON.parse(rawP);
        } catch(e) {}
        let cachedDays = null;
        try {
          const rawD = localStorage.getItem('fincestem_schedules_field_trip');
          if (rawD) cachedDays = JSON.parse(rawD);
        } catch(e) {}

        if (cachedProg && cachedDays) {
          const syncAccess = FincestemCore.progress.canAccessDay(dayNum, cachedProg, cachedDays);
          if (!syncAccess.canAccess) {
            FincestemCore.ui.toast(syncAccess.reason || `Aktivitas Day ${dayNum} terkunci! Harap selesaikan Day ${dayNum - 1} terlebih dahulu.`, 'error');
            setTimeout(() => {
              window.location.replace('dashboard.html');
            }, 600);
            return;
          }
        }
      }

      // 1. RENDER INSTAN 0 MILIDETIK (HILANGKAN SPINNER SEKETIKA, FORM LKPD LANGSUNG MUNCUL)
      try {
        if (dayNum === 3) {
          renderFieldTripDay3LKPD(isReadOnlyUrl);
        } else if (dayNum === 2) {
          renderFieldTripDay2LKPD(isReadOnlyUrl);
        } else if (dayNum === 1) {
          renderFieldTripDay1LKPD(isReadOnlyUrl);
        } else if (dayNum >= 4 && dayNum <= 7) {
          renderFieldTripGenericLKPD(dayNum, isReadOnlyUrl);
        }
      } catch (errRender) {
        console.error('Error saat render instan LKPD:', errRender);
      }

      // 2. SINKRONISASI JADWAL DI LATAR BELAKANG (NON-BLOCKING)
      try {
        const nisn = activeUser.nisn || activeUser.identifier || '';
        if (window.FincestemCore && FincestemCore.schedule && FincestemCore.progress) {
          FincestemCore.schedule.getSchedule(function(days) {
            FincestemCore.progress.getStudentProgress(nisn, function(prog) {
              window.currentStudentProgress = prog;
              const access = FincestemCore.progress.canAccessDay(dayNum, prog, days);
              if (!access.canAccess) {
                const reasonMsg = access.reason || `Aktivitas Day ${dayNum} terkunci! Harap selesaikan Day ${dayNum - 1} terlebih dahulu.`;
                FincestemCore.ui.toast(reasonMsg, 'error');
                setTimeout(() => {
                  window.location.replace('dashboard.html');
                }, 800);
                return;
              }
              if (!access.canEdit || isReadOnlyUrl) {
                const saveBtns = document.querySelectorAll('#btnSubmitLkpdApel, #saveLkpdBtn, #btnSubmitLkpdD2Akpol, #btnSubmitLkpdD2Lawang');
                saveBtns.forEach(b => {
                  b.classList.add('opacity-70', 'pointer-events-none');
                });
              }
            });
          });
        }
      } catch (eAsync) {
        console.warn('Sync background error (non-fatal):', eAsync);
      }

      loadLKPDData();
    });

    function loadLKPDData() {
      if (!activeUser) return;
      try {
        const stored = localStorage.getItem('fincestem_db_2026_v1');
        if (!stored) return;
        const db = JSON.parse(stored);
        const grp = db.groups ? db.groups.find(g => g.id === activeUser.groupId) : null;
        if (!grp) return;

        if (grp.answers) {
          if (grp.answers.ph) document.getElementById('inputPh').value = grp.answers.ph;
          if (grp.answers.debit) document.getElementById('inputDebit').value = grp.answers.debit;
          if (grp.answers.suhu) document.getElementById('inputSuhu').value = grp.answers.suhu;
          if (grp.answers.hpp) document.getElementById('inputHpp').value = grp.answers.hpp;
          if (grp.answers.hargaJual) document.getElementById('inputHargaJual').value = grp.answers.hargaJual;
          if (grp.answers.analisisFin) document.getElementById('inputAnalisisFin').value = grp.answers.analisisFin;
          if (grp.answers.catatanBudaya) document.getElementById('inputBudaya').value = grp.answers.catatanBudaya;
          if (grp.answers.kesimpulan) document.getElementById('inputKesimpulan').value = grp.answers.kesimpulan;
        }

        if (grp.fileName) {
          document.getElementById('attachedFileName').textContent = grp.fileName + ' (' + (grp.fileSize || '') + ')';
        }

        const statusBadge = document.getElementById('lkpdStatusBadge');
        const gradeBox = document.getElementById('gradeBox');

        if (grp.isGraded && grp.scores) {
          statusBadge.textContent = 'Telah Dinilai (' + (grp.scores.average || 0) + '/100)';
          statusBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-teal-100 text-teal-800';
          gradeBox.classList.remove('hidden');
          document.getElementById('lkpdAverageScore').textContent = (grp.scores.average || 0) + ' / 100';
          document.getElementById('scoreFin').textContent = grp.scores.financial || '-';
          document.getElementById('scoreCul').textContent = grp.scores.culture || '-';
          document.getElementById('scoreExp').textContent = grp.scores.exploration || '-';
          document.getElementById('scoreStem').textContent = grp.scores.stem || '-';
          document.getElementById('teacherFeedback').textContent = '"' + (grp.feedback || '') + '"';

          document.querySelectorAll('input, textarea').forEach(el => {
            el.setAttribute('disabled', 'disabled');
            el.classList.add('bg-slate-100', 'cursor-not-allowed', 'text-slate-600');
          });
          const saveBtn = document.getElementById('saveLkpdBtn');
          if (saveBtn) saveBtn.classList.add('hidden');
        } else if (grp.lkpdSubmitted) {
          statusBadge.textContent = '🔒 Telah Dikirim & Terkunci';
          statusBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-teal-100 text-teal-800 border border-teal-300';
          gradeBox.classList.add('hidden');

          document.querySelectorAll('input, textarea').forEach(el => {
            el.setAttribute('disabled', 'disabled');
            el.classList.add('bg-slate-100', 'cursor-not-allowed', 'text-slate-600');
          });
          const dropzone = document.getElementById('dropzoneBox');
          if (dropzone) dropzone.classList.add('pointer-events-none', 'opacity-60');

          const saveBtn = document.getElementById('saveLkpdBtn');
          if (saveBtn) {
            saveBtn.outerHTML = `
              <div class="w-full p-4 rounded-2xl bg-teal-50 border border-teal-300 text-teal-950 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xs mt-2">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-xl">lock</span>
                  </div>
                  <div>
                    <span class="text-xs font-black uppercase text-teal-800 tracking-wider">Status: Telah Dikirim &amp; Terkunci</span>
                    <p class="text-xs text-slate-700 font-medium">Laporan LKPD telah dikirim ke fasilitator. Untuk mencegah perubahan data, formulir terkunci. Jika memerlukan perbaikan, hubungi Fasilitator atau Koordinator Anda.</p>
                  </div>
                </div>
              </div>
            `;
          }
        }
      } catch (e) {}
    }

    function saveAndSubmitLKPD() {
      const answers = {
        ph: document.getElementById('inputPh').value.trim(),
        debit: document.getElementById('inputDebit').value.trim(),
        suhu: document.getElementById('inputSuhu').value.trim(),
        hpp: document.getElementById('inputHpp').value.trim(),
        hargaJual: document.getElementById('inputHargaJual').value.trim(),
        analisisFin: document.getElementById('inputAnalisisFin').value.trim(),
        catatanBudaya: document.getElementById('inputBudaya').value.trim(),
        kesimpulan: document.getElementById('inputKesimpulan').value.trim()
      };

      const hasAnswer = Object.values(answers).some(v => v.length > 0);
      if (!hasAnswer) {
        FincestemCore.ui.toast('Silakan isi setidaknya satu kolom jawaban pengamatan!', 'error');
        return;
      }

      const btn = document.getElementById('saveLkpdBtn');
      btn.innerHTML = '<span class="material-symbols-outlined text-lg animate-spin">refresh</span><span>Menyimpan Laporan...</span>';
      btn.classList.add('pointer-events-none', 'opacity-80');

      setTimeout(() => {
        try {
          let db = {};
          const stored = localStorage.getItem('fincestem_db_2026_v1');
          if (stored) db = JSON.parse(stored);
          if (!db.groups) db.groups = [];

          const grpId = (activeUser && activeUser.groupId) || 'group-user';
          let grp = db.groups.find(g => g.id === grpId);
          if (!grp) {
            grp = {
              id: grpId,
              name: (activeUser && activeUser.group) || 'Kelompok Siswa',
              class: (activeUser && activeUser.class) || '-',
              lkpdSubmitted: true,
              submittedAt: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
              fileName: 'LKPD_' + ((activeUser && activeUser.nisn) || 'Siswa') + '.pdf',
              fileSize: 'Dokumen Form',
              answers: answers,
              status: 'Menunggu Penilaian'
            };
            db.groups.push(grp);
          } else {
            grp.lkpdSubmitted = true;
            grp.submittedAt = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            grp.answers = answers;
            grp.status = 'Menunggu Penilaian';
          }
          localStorage.setItem('fincestem_db_2026_v1', JSON.stringify(db));
        } catch (e) {}

        // Sinkronkan ke modul progres siswa
        const urlParams = new URLSearchParams(window.location.search);
        const rawDay = urlParams.get('day');
        const dayNum = (rawDay !== null && rawDay !== '') ? parseInt(rawDay) : 2;
        if (FincestemCore.progress && activeUser && (activeUser.nisn || activeUser.identifier)) {
          FincestemCore.progress.submitTask(activeUser.nisn || activeUser.identifier, dayNum, 'lkpd', answers);
        }

        btn.innerHTML = '<span class="material-symbols-outlined text-lg">check_circle</span><span>Laporan Berhasil Disimpan</span>';
        btn.classList.remove('pointer-events-none', 'opacity-80');
        const dayLabel = dayNum === 0 ? 'Day 0 (Simulasi)' : 'Day ' + dayNum;
        FincestemCore.ui.toast('Laporan LKPD ' + dayLabel + ' berhasil disimpan & progres diperbarui!', 'success');
        loadLKPDData();
      }, 500);
    }

    // Seluruh logika dan instrumen LKPD Field Trip (Day 1 s.d. Day 7) telah dimodularisasi ke js/modules/lkpd-fieldtrip.js

  </script>
