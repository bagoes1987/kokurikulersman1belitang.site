<body class="bg-background font-body-md text-on-surface antialiased flex flex-col min-h-full">

  <!-- TOP HEADER -->
  <header class="sticky top-0 w-full z-40 bg-surface-container-lowest/90 backdrop-blur-xl border-b border-surface-container-high">
    <div class="h-16 px-4 flex items-center justify-between max-w-lg mx-auto w-full">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="p-2 rounded-xl text-primary hover:bg-surface-container transition-all">
          <span class="material-symbols-outlined text-xl">arrow_back</span>
        </a>
        <div class="flex flex-col">
          <span class="text-xs text-[#08A7B5] font-extrabold uppercase tracking-wider leading-tight">Portal Siswa</span>
          <span class="text-base font-extrabold text-on-surface leading-tight">Modul Belajar Digital</span>
        </div>
      </div>
      <button onclick="simulateDownloadPDF()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-surface-container text-primary font-bold text-xs sm:text-sm hover:bg-surface-container-high transition-all shadow-2xs">
        <span class="material-symbols-outlined text-base">download</span>
        <span>Unduh Modul</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main id="mainContentArea" class="flex-1 flex flex-col max-w-lg mx-auto w-full p-4 gap-4 pb-20">
    <div id="materiLoadingState" class="bg-surface-container-lowest rounded-3xl p-8 border border-outline-variant/25 shadow-sm flex flex-col items-center justify-center text-center gap-3 my-auto min-h-[320px]">
      <div class="w-10 h-10 border-4 border-[#08A7B5] border-t-transparent rounded-full animate-spin"></div>
      <span class="text-sm font-extrabold text-slate-800">Memuat Modul Belajar Digital...</span>
      <p class="text-xs text-slate-500 max-w-xs">Menghubungkan kurikulum resmi eksplorasi lapangan FINCESTEM.</p>
    </div>

    <!-- Copyright Footer -->
    <div class="text-center pt-3 pb-4">
      <p class="font-label-sm text-label-sm text-outline text-xs">
        &copy; 2026 Kurikulum SMAN 1 Belitang
      </p>
    </div>
  </main>

  <script src="../js/siswa_data.js?v=20261020_v2"></script>
  <script src="../js/core.js?v=20261020_v2"></script>
  <script src="../js/modules/materi-fieldtrip.js?v=20261020_v2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rawDay = urlParams.get('day');
      const dayNum = (rawDay !== null && rawDay !== '') ? parseInt(rawDay) : 1;

      // Cek kategori siswa (Field Trip vs Non-Field Trip)
      const user = FincestemCore.auth.getUser() || {};
      const studentZone = (FincestemCore.zones && FincestemCore.zones.getStudentZone)
        ? FincestemCore.zones.getStudentZone(user.nisn || user.identifier, user.class || user.class_name, user.zone)
        : (user.zone || 'FINCESTEM OKU TIMUR');
      const zUpper = (studentZone || '').toUpperCase();
      const isFieldTrip = zUpper.includes('LUAR') || zUpper.includes('FIELD') || zUpper.includes('TRIP');

      // Proteksi Alur Berurutan: Day N (N > 1) mewajibkan Day N-1 selesai
      if (dayNum > 1 && FincestemCore.progress) {
        let cachedProg = null;
        try {
          const rawP = localStorage.getItem('fincestem_progress_' + (user.nisn || user.identifier));
          if (rawP) cachedProg = JSON.parse(rawP);
        } catch(e) {}
        let cachedDays = null;
        try {
          const rawD = localStorage.getItem('fincestem_schedules_' + (isFieldTrip ? 'field_trip' : 'non_field_trip'));
          if (rawD) cachedDays = JSON.parse(rawD);
        } catch(e) {}

        if (cachedProg && cachedDays) {
          const syncAccess = FincestemCore.progress.canAccessDay(dayNum, cachedProg, cachedDays);
          if (!syncAccess.canAccess) {
            FincestemCore.ui.toast(syncAccess.reason || `Aktivitas Day ${dayNum} belum dapat diakses! Harap selesaikan Day ${dayNum - 1} terlebih dahulu.`, 'error');
            setTimeout(() => {
              window.location.replace('dashboard.html');
            }, 600);
            return;
          }
        }

        FincestemCore.progress.getStudentProgress(user.nisn || user.identifier, function(prog) {
          FincestemCore.schedule.getSchedule(function(days) {
            const access = FincestemCore.progress.canAccessDay(dayNum, prog, days);
            if (!access.canAccess) {
              const reasonMsg = access.reason || `Aktivitas Day ${dayNum} belum dapat diakses saat ini. Harap selesaikan Day ${dayNum - 1} terlebih dahulu.`;
              FincestemCore.ui.toast(reasonMsg, 'error');
              setTimeout(() => {
                window.location.replace('dashboard.html');
              }, 1200);
            }
          });
        });
      }

      const mainEl = document.querySelector('main');

      // TAMPILKAN MODUL BELAJAR SESUAI HARI (DAY 1 S.D. 7)
      if (dayNum === 3 && mainEl) {
        renderDay3FieldTripModule(mainEl);
        return;
      }

      // TAMPILKAN MODUL BELAJAR DAY 2 FIELD TRIP
      if (dayNum === 2 && mainEl) {
        renderDay2FieldTripModule(mainEl);
        return;
      }

      // TAMPILKAN MODUL BELAJAR DAY 1 FIELD TRIP
      if (dayNum === 1 && mainEl) {
        renderDay1FieldTripModule(mainEl);
        return;
      }

      // TAMPILKAN MODUL BELAJAR DAY 4 S.D. 7 FIELD TRIP
      if (dayNum === 4 && mainEl) {
        renderDay4FieldTripModule(mainEl);
        return;
      }

      // TAMPILKAN MODUL BELAJAR DAY 5 S.D. 7 FIELD TRIP
      if (dayNum >= 5 && dayNum <= 7 && mainEl) {
        renderGenericFieldTripModule(mainEl, dayNum);
        return;
      }

      if (dayNum === 0) {
        const banner = document.createElement('div');
        banner.className = 'p-4 rounded-3xl bg-amber-500/15 border border-amber-400 text-amber-950 flex items-center gap-3 shadow-xs';
        banner.innerHTML = `
          <div class="w-10 h-10 rounded-2xl bg-amber-500 text-white flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-xl">model_training</span>
          </div>
          <div class="flex flex-col min-w-0">
            <span class="text-xs font-black uppercase text-amber-800 tracking-wider">Day 0 • Gladi Bersih</span>
            <span class="text-sm font-extrabold leading-snug">Modul Simulasi &amp; Orientasi Sistem FINCESTEM</span>
            <p class="text-xs text-slate-600 mt-0.5 leading-relaxed">Pelajari contoh materi 4 pilar di bawah ini sebagai latihan sebelum kegiatan riset lapangan resmi dimulai.</p>
          </div>
        `;
        if (mainEl) mainEl.insertBefore(banner, mainEl.firstChild);
      }

      FincestemCore.schedule.getSchedule(function(days) {
        const d = days.find(x => x.day_number === dayNum);
        if (d && !d.is_open) {
          FincestemCore.ui.toast(`Materi Day ${dayNum} sedang ditutup/terkunci oleh Admin! Mengalihkan ke Dashboard...`, 'error');
          setTimeout(() => {
            window.location.replace('dashboard.html');
          }, 1200);
        }
      });
    });

    // Seluruh logika dan konten Modul Belajar Digital Field Trip (Day 1 s.d. Day 7) telah dimodularisasi ke js/modules/materi-fieldtrip.js

    function simulateDownloadPDF() {
      FincestemCore.ui.toast('Mengunduh Modul Belajar FINCESTEM-2026.pdf...', 'success');
    }
  </script>
