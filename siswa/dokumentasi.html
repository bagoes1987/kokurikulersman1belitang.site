<!DOCTYPE html>
<html class="h-full" lang="id">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>Dokumentasi Siswa - FINCESTEM 2026 - SMAN 1 Belitang</title>
  <link rel="icon" type="image/png" href="../LOGO FICESTEM2026.png">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'on-secondary-fixed-variant': '#005049',
            'on-error-container': '#93000a',
            'primary-fixed-dim': '#b6c4ff',
            'tertiary-fixed': '#e9ddff',
            'on-secondary-fixed': '#00201d',
            'primary-container': '#1e3a8a',
            'on-error': '#ffffff',
            'on-background': '#131b2e',
            'on-primary': '#ffffff',
            'surface-dim': '#d2d9f4',
            'surface-tint': '#4059aa',
            'outline': '#757682',
            'error-container': '#ffdad6',
            'tertiary-container': '#4e03b8',
            'background': '#faf8ff',
            'surface-container-high': '#e2e7ff',
            'outline-variant': '#c5c5d3',
            'on-primary-container': '#90a8ff',
            'surface-container-low': '#f2f3ff',
            'on-secondary-container': '#006f66',
            'inverse-on-surface': '#eef0ff',
            'surface': '#faf8ff',
            'surface-bright': '#faf8ff',
            'on-surface': '#131b2e',
            'on-secondary': '#ffffff',
            'on-tertiary-fixed': '#23005c',
            'secondary': '#006a61',
            'tertiary': '#340081',
            'primary-fixed': '#dce1ff',
            'on-tertiary-container': '#b89cff',
            'error': '#ba1a1a',
            'on-tertiary': '#ffffff',
            'secondary-fixed-dim': '#6bd8cb',
            'surface-variant': '#dae2fd',
            'tertiary-fixed-dim': '#d0bcff',
            'on-surface-variant': '#444651',
            'primary': '#00236f',
            'on-primary-fixed': '#00164e',
            'inverse-primary': '#b6c4ff',
            'on-tertiary-fixed-variant': '#5516be',
            'secondary-fixed': '#89f5e7',
            'on-primary-fixed-variant': '#264191',
            'inverse-surface': '#283044',
            'secondary-container': '#86f2e4',
            'surface-container-highest': '#dae2fd',
            'surface-container': '#eaedff',
            'surface-container-lowest': '#ffffff'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased flex flex-col min-h-full">

  <!-- TOP HEADER -->
  <header class="sticky top-0 w-full z-40 bg-surface-container-lowest/90 backdrop-blur-xl border-b border-surface-container-high">
    <div class="h-16 px-4 flex items-center justify-between max-w-lg mx-auto w-full">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="p-2 rounded-xl text-primary hover:bg-surface-container transition-all">
          <span class="material-symbols-outlined text-xl">arrow_back</span>
        </a>
        <div class="flex flex-col">
          <span class="text-[10.5px] text-primary font-extrabold uppercase tracking-wider leading-tight">Portal Siswa</span>
          <span class="text-sm font-bold text-on-surface leading-tight">Galeri &amp; Jurnal Dokumentasi</span>
        </div>
      </div>
      <button onclick="toggleUploadModal(true)" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-primary text-white font-bold text-xs shadow-xs hover:bg-primary/90 transition-all">
        <span class="material-symbols-outlined text-base">add_a_photo</span>
        <span>Unggah Foto</span>
      </button>
    </div>
  </header>

  <!-- MAIN DOKUMENTASI CONTENT -->
  <main class="flex-1 flex flex-col max-w-lg mx-auto w-full p-4 gap-4 pb-20">

    <div class="bg-surface-container-lowest rounded-3xl p-5 border border-outline-variant/25 shadow-sm flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <h2 class="font-extrabold text-base text-primary">Jurnal Foto Kegiatan Riset</h2>
        <span id="docCountBadge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-secondary/15 text-secondary">4 Foto Terverifikasi</span>
      </div>
      <p class="text-xs text-on-surface-variant leading-relaxed">
        Setiap kelompok wajib mengunggah bukti foto lapangan pada tiap pilar kegiatan sebagai komponen portofolio penilaian kokurikuler.
      </p>
    </div>

    <!-- FILTER BUTTONS -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
      <button onclick="filterPhotos('all')" class="photo-filter-btn py-1.5 px-3 rounded-xl text-xs font-bold bg-primary text-white shadow-xs whitespace-nowrap">Semua Pilar</button>
      <button onclick="filterPhotos('STEM')" class="photo-filter-btn py-1.5 px-3 rounded-xl text-xs font-semibold bg-surface-container-high text-on-surface-variant hover:bg-surface-container whitespace-nowrap">STEM</button>
      <button onclick="filterPhotos('Financial')" class="photo-filter-btn py-1.5 px-3 rounded-xl text-xs font-semibold bg-surface-container-high text-on-surface-variant hover:bg-surface-container whitespace-nowrap">Financial</button>
      <button onclick="filterPhotos('Culture')" class="photo-filter-btn py-1.5 px-3 rounded-xl text-xs font-semibold bg-surface-container-high text-on-surface-variant hover:bg-surface-container whitespace-nowrap">Culture</button>
      <button onclick="filterPhotos('Exploration')" class="photo-filter-btn py-1.5 px-3 rounded-xl text-xs font-semibold bg-surface-container-high text-on-surface-variant hover:bg-surface-container whitespace-nowrap">Exploration</button>
    </div>

    <!-- PHOTO GRID -->
    <div id="photoGrid" class="grid grid-cols-2 gap-3">
      <!-- Synced dynamically by JavaScript -->
    </div>

  </main>

  <!-- MODAL UPLOAD FOTO BARU -->
  <div id="uploadModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 transition-all duration-300 opacity-0 pointer-events-none">
    <div class="bg-surface-container-lowest rounded-3xl p-6 max-w-md w-full shadow-2xl flex flex-col gap-4 border border-surface-container-high">
      <div class="flex items-center justify-between">
        <h3 class="font-extrabold text-base text-primary">Unggah Foto Lapangan Baru</h3>
        <button onclick="toggleUploadModal(false)" class="p-1 rounded-full text-on-surface-variant hover:bg-surface-container">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="flex flex-col gap-3">
        <div>
          <label class="block text-xs font-bold text-on-surface mb-1">Pilar Kegiatan</label>
          <select id="modalPillarSelect" class="w-full px-3.5 py-2.5 rounded-xl border border-outline-variant/50 text-xs font-semibold focus:border-primary outline-none">
            <option value="STEM">Pilar 04 - STEM (Uji Kualitas / Alat Sains)</option>
            <option value="Financial">Pilar 01 - Financial (Wawancara Pasar / Gabah)</option>
            <option value="Culture">Pilar 02 - Culture (Sejarah / Kearifan Lokal)</option>
            <option value="Exploration">Pilar 03 - Exploration (Navigasi / Ekosistem DAS)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-on-surface mb-1">Judul / Aktivitas Foto</label>
          <input id="modalPhotoTitle" type="text" placeholder="Contoh: Pengambilan Sampel Air di BK 9" class="w-full px-3.5 py-2.5 rounded-xl border border-outline-variant/50 text-xs font-semibold focus:border-primary outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-on-surface mb-1">Keterangan / Refleksi Singkat</label>
          <textarea id="modalPhotoDesc" rows="2" placeholder="Tuliskan catatan singkat pengamatan lapangan..." class="w-full px-3.5 py-2.5 rounded-xl border border-outline-variant/50 text-xs font-normal focus:border-primary outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-on-surface mb-1">Pilih Contoh Sampel Foto</label>
          <select id="modalPhotoUrl" class="w-full px-3.5 py-2.5 rounded-xl border border-outline-variant/50 text-xs font-semibold focus:border-primary outline-none">
            <option value="https://images.unsplash.com/photo-1576086213369-97a306d36557?auto=format&fit=crop&w=600&q=80">Sampel 1: Uji pH Air di Tabung Reaksi (STEM)</option>
            <option value="https://images.unsplash.com/photo-1589923188900-85dae523342b?auto=format&fit=crop&w=600&q=80">Sampel 2: Wawancara Petani Gabah (Financial)</option>
            <option value="https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?auto=format&fit=crop&w=600&q=80">Sampel 3: Bangunan Pintu Air Kolonial (Culture)</option>
            <option value="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=600&q=80">Sampel 4: Pengukuran Debit Saluran (Exploration)</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button onclick="toggleUploadModal(false)" class="flex-1 py-2.5 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-bold text-xs transition-all">
          Batal
        </button>
        <button onclick="submitNewPhoto()" class="flex-1 py-2.5 rounded-xl bg-primary text-white font-bold text-xs hover:bg-primary/90 transition-all flex items-center justify-center gap-1.5">
          <span class="material-symbols-outlined text-sm">upload</span>
          <span>Simpan Foto</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../js/data-mock.js"></script>
  <script src="../js/core.js"></script>
  <script>
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      renderPhotos();
    });

    function toggleUploadModal(show) {
      const modal = document.getElementById('uploadModal');
      if (show) {
        modal.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        modal.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    function renderPhotos() {
      const db = FincestemDB.get();
      const list = db.documentation || [];
      const grid = document.getElementById('photoGrid');
      grid.innerHTML = '';

      const filtered = currentFilter === 'all' ? list : list.filter(p => p.pillar === currentFilter || p.category === currentFilter);
      document.getElementById('docCountBadge').textContent = list.length + ' Foto Terverifikasi';

      filtered.forEach(photo => {
        let badgeColor = 'bg-blue-100 text-blue-700';
        if (photo.pillar === 'Financial') badgeColor = 'bg-amber-100 text-amber-700';
        else if (photo.pillar === 'Culture') badgeColor = 'bg-purple-100 text-purple-700';
        else if (photo.pillar === 'Exploration') badgeColor = 'bg-emerald-100 text-emerald-700';

        const card = document.createElement('div');
        card.className = 'bg-surface-container-lowest rounded-2xl overflow-hidden border border-outline-variant/25 shadow-xs flex flex-col group cursor-pointer hover:shadow-md transition-all';
        card.onclick = () => FincestemCore.ui.openLightbox(photo.url, photo.title + ' • ' + photo.author);
        card.innerHTML = `
          <div class="relative aspect-[4/3] bg-surface-container overflow-hidden">
            <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" src="${photo.url}" alt="${photo.title}" loading="lazy">
            <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-extrabold ${badgeColor}">${photo.pillar || photo.category}</span>
          </div>
          <div class="p-2.5 flex flex-col gap-1">
            <h4 class="font-bold text-xs text-on-surface line-clamp-1 leading-tight">${photo.title}</h4>
            <p class="text-[10.5px] text-on-surface-variant line-clamp-2 leading-relaxed">${photo.description || ''}</p>
            <span class="text-[9.5px] text-outline font-semibold mt-0.5">${photo.date}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterPhotos(category) {
      currentFilter = category;
      document.querySelectorAll('.photo-filter-btn').forEach(b => {
        if (b.textContent.toLowerCase().includes(category.toLowerCase())) {
          b.className = 'photo-filter-btn py-1.5 px-3 rounded-xl text-xs font-bold bg-primary text-white shadow-xs whitespace-nowrap';
        } else {
          b.className = 'photo-filter-btn py-1.5 px-3 rounded-xl text-xs font-semibold bg-surface-container-high text-on-surface-variant hover:bg-surface-container whitespace-nowrap';
        }
      });
      renderPhotos();
    }

    function submitNewPhoto() {
      const title = document.getElementById('modalPhotoTitle').value.trim();
      const desc = document.getElementById('modalPhotoDesc').value.trim();
      const pillar = document.getElementById('modalPillarSelect').value;
      const url = document.getElementById('modalPhotoUrl').value;

      if (!title) {
        FincestemCore.ui.toast('Judul foto wajib diisi!', 'error');
        return;
      }

      FincestemDB.addDocumentation({
        title: title,
        description: desc,
        pillar: pillar,
        category: pillar,
        url: url,
        author: 'Kelompok 4 - Belitang Cerdas'
      });

      toggleUploadModal(false);
      document.getElementById('modalPhotoTitle').value = '';
      document.getElementById('modalPhotoDesc').value = '';
      FincestemCore.ui.toast('Foto dokumentasi berhasil disimpan!', 'success');
      renderPhotos();
    }
  </script>
</body>
</html>
