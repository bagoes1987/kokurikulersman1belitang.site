      </div>

      <div class="flex flex-col gap-4 mt-2">

          <label class="block text-xs font-bold text-on-surface mb-1.5">NISN (Nomor Induk Siswa Nasional)</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-lg">badge</span>
            <input id="nisnInput" type="text" placeholder="Masukkan 10 digit NISN" class="w-full pl-11 pr-4 py-3 rounded-xl border border-outline-variant/50 focus:border-[#08A7B5] focus:ring-2 focus:ring-[#08A7B5]/20 text-sm font-semibold outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-on-surface mb-1.5">Kata Sandi</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-lg">lock</span>
            <input id="passwordInput" type="password" placeholder="Masukkan kata sandi" class="w-full pl-11 pr-11 py-3 rounded-xl border border-outline-variant/50 focus:border-[#08A7B5] focus:ring-2 focus:ring-[#08A7B5]/20 text-sm font-semibold outline-none transition-all">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 text-on-surface-variant hover:text-on-surface">
              <span id="passwordEyeIcon" class="material-symbols-outlined text-lg">visibility</span>
            </button>
          </div>
        </div>

        <button id="submitBtn" onclick="handleSiswaLogin()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#08A7B5] to-[#068490] hover:from-[#0795a2] hover:to-[#05717c] text-white font-bold text-sm shadow-md hover:shadow-lg active:scale-98 transition-all flex items-center justify-center gap-2 mt-2 cursor-pointer">

        </button>

  <script src="../js/core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (FincestemCore.auth.isLoggedIn() && FincestemCore.auth.getRole() === 'siswa') {
        window.location.replace('dashboard.html');
      }

      const pwdInput = document.getElementById('passwordInput');
      if (pwdInput) {
        pwdInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') handleSiswaLogin();
        });
      }
    });

    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('passwordEyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function handleSiswaLogin() {
      const nisn = document.getElementById('nisnInput').value.trim();
      const pwd = document.getElementById('passwordInput').value.trim();
      const btnText = document.getElementById('btnText');
      const btn = document.getElementById('submitBtn');

      if (!nisn) {
        FincestemCore.ui.toast('Silakan masukkan NISN resmi Anda!', 'error');
        return;
      }
      if (!pwd) {
        FincestemCore.ui.toast('Silakan masukkan kata sandi!', 'error');
        return;
      }

      btnText.textContent = 'Memverifikasi Data...';
      btn.classList.add('opacity-80', 'pointer-events-none');

      setTimeout(() => {
        const res = FincestemCore.auth.validateLogin(nisn, pwd, 'siswa');
        if (!res.success) {
          btnText.textContent = 'Masuk ke Portal Siswa';
          btn.classList.remove('opacity-80', 'pointer-events-none');
          FincestemCore.ui.toast(res.message, 'error');
          return;
        }

        FincestemCore.auth.setUser(res.user, 'siswa');
        FincestemCore.ui.toast('Berhasil masuk! Mengalihkan ke Dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 400);
      }, 400);
    }
  </script>
